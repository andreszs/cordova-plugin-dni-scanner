import groovy.json.JsonSlurper

def dniScannerReadCordovaAndroidMajor() {
    def packageCandidates = [
        rootProject.file('../../node_modules/cordova-android/package.json'),
        rootProject.file('../node_modules/cordova-android/package.json')
    ]
    for (def packageFile : packageCandidates) {
        if (!packageFile.exists()) {
            continue
        }
        def platformPackage = new JsonSlurper().parse(packageFile)
        def versionText = platformPackage.version == null ? '' : platformPackage.version.toString()
        def matcher = versionText =~ /^(\d+)\./
        if (matcher.find()) {
            return Integer.parseInt(matcher.group(1))
        }
    }

    // Fallback for installations where the platform package is not retained in node_modules.
    // The pair is deliberately exact so a manually overridden compileSdk cannot silently
    // select a newer CameraX for an older Android Gradle Plugin.
    def configFile = rootProject.file('cdv-gradle-config.json')
    if (configFile.exists()) {
        def config = new JsonSlurper().parse(configFile)
        def key = "${config.AGP_VERSION}:${config.SDK_VERSION}"
        def knownToolchains = [
            '7.2.1:32': 11,
            '7.4.2:33': 12,
            '8.3.0:34': 13,
            '8.7.3:35': 14,
            '8.10.1:36': 15
        ]
        if (knownToolchains.containsKey(key)) {
            return knownToolchains[key]
        }
    }
    throw new GradleException(
        'cordova-plugin-dni-scanner: no se pudo determinar de forma segura la versión de cordova-android.'
    )
}

def dniScannerCameraXByCordova = [
    11: '1.1.0',
    12: '1.2.3',
    13: '1.4.2',
    14: '1.5.2',
    15: '1.6.0'
]

// Same versions already provided at runtime by each cordova-android release.
// compileOnly exposes WebViewAssetLoader's PathHandler type to this plugin's javac
// without adding or overriding the host's AndroidX WebKit dependency.
def dniScannerWebKitByCordova = [
    11: '1.4.0',
    12: '1.6.0',
    13: '1.6.0',
    14: '1.12.1',
    15: '1.14.0'
]

def dniScannerCordovaMajor = dniScannerReadCordovaAndroidMajor()
def dniScannerCameraXVersion = project.findProperty('dniScannerCameraXVersion')?.toString()

if (dniScannerCameraXVersion == null || dniScannerCameraXVersion.trim().isEmpty()) {
    dniScannerCameraXVersion = dniScannerCameraXByCordova[dniScannerCordovaMajor]
}

if (dniScannerCameraXVersion == null) {
    throw new GradleException(
        "cordova-plugin-dni-scanner: cordova-android ${dniScannerCordovaMajor} no está soportado. " +
        'Versiones soportadas: 11, 12, 13, 14 y 15.'
    )
}

logger.lifecycle(
    "cordova-plugin-dni-scanner: cordova-android ${dniScannerCordovaMajor}, CameraX ${dniScannerCameraXVersion}"
)

dependencies {
    implementation "androidx.camera:camera-core:${dniScannerCameraXVersion}"
    implementation "androidx.camera:camera-camera2:${dniScannerCameraXVersion}"
    implementation "androidx.camera:camera-lifecycle:${dniScannerCameraXVersion}"
    implementation("androidx.camera:camera-view:${dniScannerCameraXVersion}") {
        // camera-view 1.4+ pulls the complete video stack for CameraController.
        // The scanner uses PreviewView directly and never references CameraController
        // or records video, so keeping it would add Media3/Guava code for no feature.
        exclude group: 'androidx.camera', module: 'camera-video'
    }
    // CameraX 1.1 declares this as runtime-only, while the plugin also reads capture rotation.
    implementation 'androidx.exifinterface:exifinterface:1.3.2'
    // Public return type of ProcessCameraProvider.getInstance across CameraX 1.1-1.6.
    implementation 'com.google.guava:listenablefuture:1.0'
    compileOnly "androidx.webkit:webkit:${dniScannerWebKitByCordova[dniScannerCordovaMajor]}"
}
